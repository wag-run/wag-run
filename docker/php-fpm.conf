; Loaded after the image's zz-docker.conf, which listens on TCP 9000.

[global]
error_log = /proc/self/fd/2

[www]
listen = /tmp/php-fpm.sock
listen.mode = 0600

; nginx already logs each request.
access.log = /dev/null

; Pass the container's environment to PHP: it is the app's configuration.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500
