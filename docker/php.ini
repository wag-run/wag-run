expose_php = Off
memory_limit = 256M
; A file may be 50 MB (WORKFLOW_FILES_MAX_MB); a request carries it plus the
; other form fields. Keep client_max_body_size in nginx.conf in step.
upload_max_filesize = 50M
post_max_size = 55M

; The code in the image never changes, so skip the per-request file checks.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
