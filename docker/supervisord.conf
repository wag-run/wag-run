; Runs as the unprivileged container user: no user= switches, no control
; socket, and nothing written outside /tmp. All output goes to the container log.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -e /dev/stderr -g "daemon off;"
autorestart=true
stopsignal=QUIT
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:scheduler]
command=php artisan schedule:work
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

; --max-time recycles each worker hourly; supervisor starts it again.
[program:worker]
process_name=%(program_name)s_%(process_num)02d
command=php artisan queue:work --queue=workflows,default --tries=1 --timeout=0 --sleep=1 --max-time=3600
numprocs=%(ENV_QUEUE_WORKERS)s
autorestart=true
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
