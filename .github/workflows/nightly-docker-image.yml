name: Nightly Docker image

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-docker-image
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'wag-run/wag-run' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: nightly
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Nightly version
        id: version
        run: |
          date="$(date -u +%Y%m%d)"
          echo "date=${date}" >> "$GITHUB_OUTPUT"
          echo "version=nightly-${date}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            wagrun/wag-run
            ghcr.io/wag-run/wag-run
          # nightly moves every night; nightly-20261124 stays on that night's
          # build. Never latest, which belongs to releases.
          flavor: |
            latest=false
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-${{ steps.version.outputs.date }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
