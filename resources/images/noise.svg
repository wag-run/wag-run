<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" opacity="0.25">
    <filter id="noise" x="0" y="0" width="100%" height="100%" color-interpolation-filters="linearRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.2" numOctaves="4" seed="15" stitchTiles="stitch" result="turbulence" />
        <feSpecularLighting in="turbulence" surfaceScale="5" specularConstant="1" specularExponent="20" lighting-color="#3939a8" result="lighting">
            <feDistantLight azimuth="3" elevation="18" />
        </feSpecularLighting>
        <feColorMatrix in="lighting" type="saturate" values="0" />
    </filter>
    <rect width="700" height="700" filter="url(#noise)" />
</svg>
